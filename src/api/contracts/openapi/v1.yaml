  /api/v1/tracing/coverage/report:
    post:
      summary: Report and Verify Propagation Coverage across Hops
      operationId: reportTracePropagationCoverage
      description: "Body fields are snake_case."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, source_service, external_id, hop_source, hop_target, hop_type, total_spans, propagated_spans]
              properties:
                tenant_id: { type: string }
                source_service: { type: string }
                external_id: { type: string }
                correlation_id: { type: string }
                hop_source: { type: string }
                hop_target: { type: string }
                hop_type: { type: string, enum: [OUTBOX_TO_RELAY, RELAY_TO_BROKER, BROKER_TO_CONSUMER, CONSUMER_TO_DB, PROJECTION] }
                total_spans: { type: integer, minimum: 0 }
                propagated_spans: { type: integer, minimum: 0, description: "Must be <= total_spans" }
      responses:
        "200":
          description: "Propagation coverage evaluated and recorded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation error (ErrInvalidCoverageReport): required fields, hop_type enum, counts >= 0, propagated_spans <= total_spans"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Request id, echoed in the response and meta.requestId; generated (UUIDv7) when absent
      schema: { type: string }
    XCorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      description: Correlation id (UUID where the route persists it); defaults to a generated UUIDv7
      schema: { type: string }
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, correlationId, causationId, timestamp, executionTimeMs, apiVersion]
      properties:
        requestId: { type: string }
        correlationId: { type: string }
        causationId: { type: string }
        timestamp: { type: string, format: date-time }
        executionTimeMs: { type: integer }
        apiVersion: { type: string }
    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        issue: { type: string }
        rule: { type: string }
        rejectedValue: {}
    ErrorBody:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Canonical code such as VALIDATION_FAILED, RESOURCE_NOT_FOUND, CONFLICT, PRECONDITION_FAILED, VERSION_GAP_DETECTED, DATABASE_CONSTRAINT_VIOLATION or INTERNAL_SERVER_ERROR
        message: { type: string }
        retryable: { type: boolean }
        details:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }
    SuccessEnvelope:
      type: object
      required: [success, statusCode, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        statusCode: { type: integer }
        data: {}
        error: { type: "null" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    ErrorEnvelope:
      type: object
      required: [success, statusCode, error, meta]
      properties:
        success: { type: boolean, enum: [false] }
        statusCode: { type: integer, minimum: 400 }
        data: { type: "null" }
        error: { $ref: "#/components/schemas/ErrorBody" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

                tier: { type: string, enum: [T0, T1, T2] }
                status: { type: string, enum: [OK, LAGGING, STALLED, STOPPED, PAUSED, UNKNOWN] }
                pause_reason: { type: string, enum: [NONE, BREAKER_OPEN, BACKPRESSURE, OPERATOR_HALT, REBALANCE, CORRUPT_HEAD] }
                lag_seconds: { type: number }
                oldest_held_age_seconds: { type: number }
                runbook_url: { type: string }
      responses:

  /api/v1/schemas/register:
    post:
      summary: Register Schema Version with Transitive Compatibility Check
      operationId: registerSubjectSchemaVersion
      description: "Body fields are snake_case. Compatibility is enforced for Avro (a field is required iff it has no default) and JSON Schema (properties/required). BACKWARD breaks on a new required field without default or a type change; FORWARD on a removed required field or a type change; FULL both; *_TRANSITIVE check the whole lineage."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, subject_name, schema_version, schema_definition]
              properties:
                tenant_id: { type: string }
                source_service: { type: string }
                external_id: { type: string }
                correlation_id: { type: string }
                subject_name: { type: string }
                schema_version: { type: integer, minimum: 1, description: "Must be monotonic for the subject" }
                compatibility_mode:
                  type: string
                  enum: [BACKWARD, FORWARD, FULL, BACKWARD_TRANSITIVE, FORWARD_TRANSITIVE, FULL_TRANSITIVE]
                  description: Defaults to FULL_TRANSITIVE. NONE is not accepted at the API.
                schema_definition: { type: string, description: "Avro schema or JSON Schema document as a string" }
      responses:
        "201":
          description: "Schema version registered after the compatibility check passed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation error, including an unknown compatibility_mode"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Conflict: the candidate is incompatible with the lineage for the mode (message lists the violations), duplicate fingerprint, or non-monotonic version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"


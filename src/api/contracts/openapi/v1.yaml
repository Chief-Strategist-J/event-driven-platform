        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"


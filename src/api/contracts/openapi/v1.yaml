# OpenAPI 3.1 REST Specification
openapi: 3.1.0
info:
  title: event-driven-platform API
  version: 1.3.0
  description: |
    Event-driven platform REST API. Every response uses the common envelope
    {success, statusCode, data, error, meta}. success is false for every status >= 400 and
    error carries {code, message, retryable, details?}. Server-side detail (SQL text, constraint
    names) is never exposed: database integrity violations surface as a generic 409/400 message
    and unexpected failures as a generic 500.

    Headers (all optional, HTTP names are case-insensitive): X-Request-ID (echoed, generated as
    UUIDv7 if absent), X-Correlation-ID (echoed; handlers default it to a UUIDv7, and routes
    that persist it require a UUID), X-Causation-ID, X-Tenant-ID (fallback for a missing body
    tenant on backpressure, replay, offsets and retries/attempts routes), X-Idempotency-Key
    (POST /api/v1/outbox; POST /api/v1/commands/dispatch, where it is mandatory).

    Field casing differs per feature and is documented on each route: camelCase for outbox,
    consumers/inbox, dlq, schemas/versions|compatibility|upcast|upcasters, events, retries,
    consumer-groups, offsets, backpressure and replay; snake_case for tenants, cdc,
    partitioning, materialized-views, consistency, commands/queries (cqrs), schemas/register
    and the rest of schema-evolution, audits, encryption, auth, domain-events, communication,
    ops and tracing.

    1.1.0: added POST /api/v1/schemas/upcasters and GET /api/v1/offsets/lag, shared
    Error/Success envelope components, documented the 400/404/409 responses introduced by the
    error-mapping fixes (typed errors via errors.As), 202 QUEUED_IN_OUTBOX for async command
    dispatch, schema compatibility enforcement (409), replay run id/state rules, and corrected
    request schemas that had drifted from the Go contract structs (replay, offsets
    fast-forward/rewind, backpressure, auth, schema-evolution, domain-events, ops triage).

    1.2.0 (second pass): tenant_id is now required (400) on the read endpoints that previously
    returned 200 with null data or used an implicit "default" tenant; non-UUID quarantineId and
    replay correlationId return 400; resolve returns 409 when a supplied consistency token needs
    a signing key the tenant does not have; POST /api/v1/commands/keys no longer returns
    secret_key_hash; verify-envelope returns 403 for a SUSPENDED tenant. Added servers and the
    health endpoints (/health/live, /health/ready on the admin listener).

    Runtime and deployment (see docs/adr/ADR-0003): the service image is published as
    chiefj/event-driven-platform (tags latest, v2, fixes) on Docker Hub. It listens on 8080 (API)
    and 8081 (admin: /health/live, /health/ready; there is no /metrics endpoint). In the compose
    stack the API is reached through the Envoy gateway on host port 8080. The service reads only
    DATABASE_URL (plus KAFKA_BROKERS, SCHEMA_REGISTRY_URL, OTEL_EXPORTER_OTLP_ENDPOINT, PORT,
    ADMIN_PORT, ADMIN_HOST). The outbox relay publishes to a Kafka topic named after
    aggregateType and the broker does not auto-create topics, so create the topic first.
    Migrations are not run at startup; database/migrations/sql/0028 was applied by hand.

    1.3.0 (production-readiness pass): GET /metrics (Prometheus text) on the admin listener;
    request bodies larger than MAX_REQUEST_BODY_BYTES (default 1 MiB) are rejected with 413
    PAYLOAD_TOO_LARGE when the declared Content-Length is over the cap; POST
    /api/v1/consistency/incidents/{id}/heal and GET /api/v1/schemas/{subject}/readiness now
    require tenant_id (400); the CDC routes call Kafka Connect/Debezium when the service is
    started with KAFKA_CONNECT_URL (otherwise an in-memory mock, which only records state).
servers:
  - url: http://localhost:8080
    description: Envoy gateway in the local compose stack (API, /api/v1/...)
  - url: http://localhost:18080
    description: Direct service port when run with `docker run -p 127.0.0.1:18080:8080`

paths:
  /health/live:
    get:
      summary: Liveness probe (admin listener)
      operationId: getHealthLive
      description: "Served on the admin listener (port 8081, not the public API port 8080). In a container the admin listener binds 0.0.0.0 when ADMIN_HOST=0.0.0.0 is set; it is not routed by Envoy."
      servers:
        - url: http://localhost:8081
          description: Admin listener
      responses:
        "200":
          description: "Process is alive"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [alive] }
  /metrics:
    get:
      summary: Prometheus metrics (admin listener)
      operationId: getMetrics
      description: "Served on the admin listener (port 8081), not the public API port. Prometheus text exposition format 0.0.4: http_requests_total{method,route,status}, http_request_duration_seconds, http_requests_in_flight, go_goroutines, go_memstats_heap_alloc_bytes, go_gc_cycles_total, process_start_time_seconds, edp_build_info{version}."
      servers:
        - url: http://localhost:8081
          description: Admin listener
      responses:
        "200":
          description: "Metrics in Prometheus text format"
          content:
            text/plain:
              schema: { type: string }
  /health/ready:
    get:
      summary: Readiness probe (admin listener)
      operationId: getHealthReady
      description: "Served on the admin listener (port 8081). Returns 200 {\"status\":\"ready\"} when the service is ready."
      servers:
        - url: http://localhost:8081
          description: Admin listener
      responses:
        "200":
          description: "Service is ready"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ready] }
  /api/v1/schemas:
    post:
      summary: Register Event Schema
      operationId: registerSchema
      description: "Schema registry facade (Apicurio). Apicurio is only written by this route."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      responses:
        "201":
          description: "Schema successfully registered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/outbox:
    post:
      summary: Stage Transactional Outbox Record
      operationId: createOutboxRecord
      description: "Body fields are camelCase and unknown fields are rejected. The relay publishes to the Kafka topic named by aggregateType (topic must exist: broker auto-create is disabled, otherwise rows are PARKED after 5 retries with Unknown Topic Or Partition) and sends event_type, schema_version, source_service plus custom headers as Kafka record headers."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
            description: Unique business command idempotency key preventing duplicate aggregates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - eventType
                - schemaVersion
                - payload
              properties:
                tenantId:
                  type: string
                sourceService:
                  type: string
                externalId:
                  type: string
                aggregateType:
                  type: string
                aggregateId:
                  type: string
                aggregateVersion:
                  type: integer
                  minimum: 1
                eventType:
                  type: string
                schemaVersion:
                  type: string
                payload:
                  type: object
                  description: Event body strictly without floating-point numbers
                headers:
                  type: object
                  additionalProperties:
                    type: string
                cdcMode:
                  type: boolean
                  description: When true executes write path step 5 (insert and immediate delete in same tx for WAL CDC)
      responses:
        "201":
          description: "Outbox record successfully staged"
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, data, meta]
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          description: "Malformed JSON, unknown field or validation failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "CONFLICT - duplicate externalId submitted without an X-Idempotency-Key (idempotent replays with the same key return the stored record)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: "Request body larger than MAX_REQUEST_BODY_BYTES (PAYLOAD_TOO_LARGE)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/outbox/relay:
    post:
      summary: Trigger Outbox Relay Batch
      operationId: relayOutboxBatch
      description: "Publishes PENDING outbox rows to Kafka (topic == aggregateType). Kafka headers event_type, schema_version and source_service are set on every record."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchSize:
                  type: integer
                  minimum: 1
                  default: 50
      responses:
        "200":
          description: "Batch successfully relayed"
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, data, meta]
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  data:
                    type: object
                    required: [publishedCount]
                    properties:
                      publishedCount: { type: integer }
                  meta:
                    type: object
                    required: [requestId, correlationId, timestamp, executionTimeMs, apiVersion]
                    properties:
                      requestId: { type: string }
                      correlationId: { type: string }
                      timestamp: { type: string }
                      executionTimeMs: { type: integer }
                      apiVersion: { type: string }
        "400":
          description: "Validation failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/consumers/inbox:
    post:
      summary: Ingest and Process Event with Idempotent Consumer Gate
      operationId: consumeInboxEvent
      description: "Body fields are camelCase."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, tenantId, handlerId, aggregateType, aggregateId, aggregateVersion, eventType, schemaVersion, payload]
              properties:
                eventId: { type: string, format: uuid }
                tenantId: { type: string }
                handlerId: { type: string }
                aggregateType: { type: string }
                aggregateId: { type: string }
                aggregateVersion: { type: integer, minimum: 1 }
                eventType: { type: string }
                schemaVersion: { type: string }
                semanticClass:
                  type: string
                  enum: [STATE, DELTA]
                  description: Empty or omitted defaults to DELTA; any other value is a 400.
                payload: {}
                headers:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: "Event successfully processed or acknowledged duplicate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation failed (eventId not a UUID, semanticClass not STATE or DELTA, missing fields)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Version gap detected (upstream loss); event held"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "423":
          description: "Aggregate locked or parked due to poison pill"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/dlq/quarantine:
    post:
      summary: Quarantine Failed Event Message and Park Aggregate
      operationId: quarantineEvent
      description: "Body fields are camelCase. The correlation id is taken from the X-Correlation-ID header and must be a UUID when supplied."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, sourceService, externalId, topic, partition, sourceOffset, consumerGroup, handlerId, eventId, aggregateType, aggregateId, aggregateVersion, eventType, payload, failureReason, errorCode]
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                topic: { type: string }
                partition: { type: integer, minimum: 0 }
                sourceOffset: { type: integer, minimum: 0 }
                consumerGroup: { type: string }
                handlerId: { type: string }
                eventId: { type: string, format: uuid }
                aggregateType: { type: string }
                aggregateId: { type: string }
                aggregateVersion: { type: integer, minimum: 1 }
                eventType: { type: string }
                payload: {}
                headers:
                  type: object
                  additionalProperties: { type: string }
                  default: {}
                  description: Optional; omitted or null is stored as an empty object.
                failureReason: { type: string }
                errorCode: { type: string }
      responses:
        "201":
          description: "Event quarantined and aggregate key parked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation error (eventId or X-Correlation-ID not a UUID, missing fields)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Duplicate externalId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: "Precondition failed (infrastructure outages forbidden from DLQ)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/dlq/redrive:
    post:
      summary: Attempt Bounded Redrive of Quarantined Event
      operationId: redriveQuarantinedEvent
      description: "quarantineId must be a UUID; a non-UUID value returns 400."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - quarantineId
              properties:
                tenantId: { type: string }
                quarantineId: { type: string, format: uuid }
      responses:
        "200":
          description: "Event redriven successfully and aggregate unparked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Quarantined record not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Redrive attempt failed or exceeded maximum attempts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/dlq/discard:
    post:
      summary: Discard Quarantined Event and Release Aggregate Parking Lock
      operationId: discardQuarantinedEvent
      description: "quarantineId must be a UUID; a non-UUID value returns 400."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - quarantineId
                - actorId
                - reason
              properties:
                tenantId: { type: string }
                quarantineId: { type: string, format: uuid }
                actorId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: "Event discarded and aggregate unparked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Quarantined record not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/dlq/quarantined:
    get:
      summary: List and Filter Quarantined Events
      operationId: listQuarantinedEvents
      description: "Query parameters are camelCase. limit is 1-100 (default 20 when out of range)."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
        - name: tenantId
          in: query
          required: true
          schema: { type: string }
        - name: handlerId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [QUARANTINED, REDRIVING, REDRIVEN_SUCCESS, COMPENSATED, DISCARDED]
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: "List of quarantined records"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "tenantId query parameter missing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/schemas/versions:
    post:
      summary: Register Event Schema Version
      operationId: registerSchemaVersion
      description: "Body fields are camelCase."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - streamName
                - eventType
                - schemaVersion
                - schemaId
                - format
                - compatibilityMode
                - schemaDefinition
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string, format: uuid }
                streamName: { type: string }
                eventType: { type: string }
                schemaVersion: { type: integer, minimum: 1 }
                schemaId: { type: string }
                format:
                  type: string
                  enum: [JSON_SCHEMA, AVRO, PROTOBUF]
                compatibilityMode:
                  type: string
                  enum: [FULL_TRANSITIVE, BACKWARD_TRANSITIVE, FORWARD_TRANSITIVE, NONE]
                schemaDefinition: { type: object }
      responses:
        "201":
          description: "Schema version successfully registered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Malformed request or validation failure"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Conflict (duplicate externalId or schema version)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/schemas/compatibility/check:
    post:
      summary: Evaluate Schema Compatibility Preflight
      operationId: checkSchemaCompatibility
      description: "Body fields are camelCase."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - streamName
                - eventType
                - targetVersion
                - compatibilityMode
                - newSchema
              properties:
                tenantId: { type: string }
                streamName: { type: string }
                eventType: { type: string }
                targetVersion: { type: integer, minimum: 1 }
                compatibilityMode:
                  type: string
                  enum: [FULL_TRANSITIVE, BACKWARD_TRANSITIVE, FORWARD_TRANSITIVE, NONE]
                newSchema: { type: object }
      responses:
        "200":
          description: "Compatibility check result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Malformed request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/schemas/upcasters:
    post:
      summary: Register Event Upcaster Step
      operationId: registerEventUpcaster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - sourceService
                - externalId
                - eventType
                - fromVersion
                - toVersion
                - transformerName
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string, format: uuid }
                eventType: { type: string }
                fromVersion: { type: integer, minimum: 1 }
                toVersion: { type: integer, minimum: 1 }
                transformerName:
                  type: string
                  description: Name of a transformer registered in code at startup. The built-in identity transformer covers additive version bumps. An unknown name is accepted at registration and only fails (400) when the step is executed by /api/v1/schemas/upcast.
      responses:
        "201":
          description: Upcaster registered (UpcasterRecord with isActive)
        "400":
          description: Validation failed or malformed request
        "409":
          description: Duplicate externalId
        "500":
          description: Unexpected server error

  /api/v1/schemas/upcast:
    post:
      summary: Execute In-Memory Upcast Pipeline
      operationId: upcastEventPayload
      description: "Body fields are camelCase. Steps must first be registered via POST /api/v1/schemas/upcasters; the built-in identity transformer handles additive bumps."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - eventType
                - sourceVersion
                - targetVersion
                - payload
              properties:
                tenantId: { type: string }
                eventType: { type: string }
                sourceVersion: { type: integer, minimum: 1 }
                targetVersion: { type: integer, minimum: 1 }
                payload: { type: object }
      responses:
        "200":
          description: "Successfully transformed event payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: "Malformed request, incomplete upcast chain or transformer failure (unknown transformer name fails here)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "Unexpected server error; generic message, no internal detail is exposed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/events/evaluate-sequence:
    post:
      summary: Ingest and Evaluate Event Sequence Ordering
      operationId: evaluateEventSequence
      description: "Body fields are camelCase; payload and headers are arbitrary JSON values."
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XCorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, sourceService, externalId, consumerGroup, handlerId, aggregateType, aggregateId, aggregateVersion, eventId, eventType, payload, ownerEpoch]
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }

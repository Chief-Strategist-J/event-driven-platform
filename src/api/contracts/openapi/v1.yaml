# OpenAPI 3.1 REST Specification
openapi: 3.1.0
info:
  title: event-driven-platform API
  version: 1.0.0
paths:
  /api/v1/schemas:
    post:
      summary: Register Event Schema
      operationId: registerSchema
      responses:
        "201":
          description: Schema successfully registered
        "400":
          description: Validation failed
  /api/v1/outbox:
    post:
      summary: Stage Transactional Outbox Record
      operationId: createOutboxRecord
      parameters:
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
            description: Unique business command idempotency key preventing duplicate aggregates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - eventType
                - schemaVersion
                - payload
              properties:
                tenantId:
                  type: string
                sourceService:
                  type: string
                externalId:
                  type: string
                aggregateType:
                  type: string
                aggregateId:
                  type: string
                aggregateVersion:
                  type: integer
                  minimum: 1
                eventType:
                  type: string
                schemaVersion:
                  type: string
                payload:
                  type: object
                  description: Event body strictly without floating-point numbers
                headers:
                  type: object
                  additionalProperties:
                    type: string
                cdcMode:
                  type: boolean
                  description: When true executes write path step 5 (insert and immediate delete in same tx for WAL CDC)
      responses:
        "201":
          description: Outbox record successfully staged
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, data, meta]
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          description: Validation failed
        "500":
          description: Internal server error
  /api/v1/outbox/relay:
    post:
      summary: Trigger Outbox Relay Batch
      operationId: relayOutboxBatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchSize:
                  type: integer
                  minimum: 1
                  default: 50
      responses:
        "200":
          description: Batch successfully relayed
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, data, meta]
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  data:
                    type: object
                    required: [publishedCount]
                    properties:
                      publishedCount: { type: integer }
                  meta:
                    type: object
                    required: [requestId, correlationId, timestamp, executionTimeMs, apiVersion]
                    properties:
                      requestId: { type: string }
                      correlationId: { type: string }
                      timestamp: { type: string }
                      executionTimeMs: { type: integer }
                      apiVersion: { type: string }
        "400":
          description: Validation failed
        "500":
          description: Internal server error
  /api/v1/consumers/inbox:
    post:
      summary: Ingest and Process Event with Idempotent Consumer Gate
      operationId: consumeInboxEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - eventId
                - tenantId
                - handlerId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - eventType
                - schemaVersion
                - semanticClass
                - payload
              properties:
                eventId:
                  type: string
                tenantId:
                  type: string
                handlerId:
                  type: string
                aggregateType:
                  type: string
                aggregateId:
                  type: string
                aggregateVersion:
                  type: integer
                  minimum: 1
                eventType:
                  type: string
                schemaVersion:
                  type: string
                semanticClass:
                  type: string
                  enum: [STATE, DELTA]
                payload:
                  type: object
                headers:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Event successfully processed or acknowledged duplicate
        "409":
          description: Version gap detected (upstream loss); event held
        "423":
          description: Aggregate locked or parked due to poison pill
        "400":
          description: Validation failed
        "500":
          description: Internal server error
  /api/v1/dlq/quarantine:
    post:
      summary: Quarantine Failed Event Message and Park Aggregate
      operationId: quarantineEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - topic
                - partition
                - sourceOffset
                - consumerGroup
                - handlerId
                - eventId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - eventType
                - payload
                - failureReason
                - errorCode
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                topic: { type: string }
                partition: { type: integer, minimum: 0 }
                sourceOffset: { type: integer, minimum: 0 }
                consumerGroup: { type: string }
                handlerId: { type: string }
                eventId: { type: string }
                aggregateType: { type: string }
                aggregateId: { type: string }
                aggregateVersion: { type: integer, minimum: 1 }
                eventType: { type: string }
                payload: { type: object }
                headers:
                  type: object
                  additionalProperties: { type: string }
                failureReason: { type: string }
                errorCode: { type: string }
      responses:
        "201":
          description: Event quarantined and aggregate key parked
        "400":
          description: Validation error
        "412":
          description: Precondition failed (infrastructure outages forbidden from DLQ)

  /api/v1/dlq/redrive:
    post:
      summary: Attempt Bounded Redrive of Quarantined Event
      operationId: redriveQuarantinedEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - quarantineId
              properties:
                tenantId: { type: string }
                quarantineId: { type: string }
      responses:
        "200":
          description: Event redriven successfully and aggregate unparked
        "409":
          description: Redrive attempt failed or exceeded maximum attempts
        "404":
          description: Quarantined record not found

  /api/v1/dlq/discard:
    post:
      summary: Discard Quarantined Event and Release Aggregate Parking Lock
      operationId: discardQuarantinedEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - quarantineId
                - actorId
                - reason
              properties:
                tenantId: { type: string }
                quarantineId: { type: string }
                actorId: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Event discarded and aggregate unparked
        "404":
          description: Quarantined record not found

  /api/v1/dlq/quarantined:
    get:
      summary: List and Filter Quarantined Events
      operationId: listQuarantinedEvents
      parameters:
        - name: tenantId
          in: query
          required: true
          schema: { type: string }
        - name: handlerId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [QUARANTINED, REDRIVING, REDRIVEN_SUCCESS, COMPENSATED, DISCARDED]
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of quarantined records

  /api/v1/schemas/versions:
    post:
      summary: Register Event Schema Version
      operationId: registerSchemaVersion
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - streamName
                - eventType
                - schemaVersion
                - schemaId
                - format
                - compatibilityMode
                - schemaDefinition
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string, format: uuid }
                streamName: { type: string }
                eventType: { type: string }
                schemaVersion: { type: integer, minimum: 1 }
                schemaId: { type: string }
                format:
                  type: string
                  enum: [JSON_SCHEMA, AVRO, PROTOBUF]
                compatibilityMode:
                  type: string
                  enum: [FULL_TRANSITIVE, BACKWARD_TRANSITIVE, FORWARD_TRANSITIVE, NONE]
                schemaDefinition: { type: object }
      responses:
        "201":
          description: Schema version successfully registered
        "400":
          description: Validation or compatibility check failed

  /api/v1/schemas/compatibility/check:
    post:
      summary: Evaluate Schema Compatibility Preflight
      operationId: checkSchemaCompatibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - streamName
                - eventType
                - targetVersion
                - compatibilityMode
                - newSchema
              properties:
                tenantId: { type: string }
                streamName: { type: string }
                eventType: { type: string }
                targetVersion: { type: integer, minimum: 1 }
                compatibilityMode:
                  type: string
                  enum: [FULL_TRANSITIVE, BACKWARD_TRANSITIVE, FORWARD_TRANSITIVE, NONE]
                newSchema: { type: object }
      responses:
        "200":
          description: Compatibility check result
        "400":
          description: Malformed request

  /api/v1/schemas/upcast:
    post:
      summary: Execute In-Memory Upcast Pipeline
      operationId: upcastEventPayload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - eventType
                - sourceVersion
                - targetVersion
                - payload
              properties:
                tenantId: { type: string }
                eventType: { type: string }
                sourceVersion: { type: integer, minimum: 1 }
                targetVersion: { type: integer, minimum: 1 }
                payload: { type: object }
      responses:
        "200":
          description: Successfully transformed event payload
        "400":
          description: Transformation error or broken chain

  /api/v1/events/evaluate-sequence:
    post:
      summary: Ingest and Evaluate Event Sequence Ordering
      operationId: evaluateEventSequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - consumerGroup
                - handlerId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - eventId
                - eventType
                - payload
                - ownerEpoch
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                consumerGroup: { type: string }
                handlerId: { type: string }
                aggregateType: { type: string }
                aggregateId: { type: string }
                aggregateVersion: { type: integer, minimum: 1 }
                eventId: { type: string }
                eventType: { type: string }
                payload: { type: string }
                headers: { type: object }
                sourceOffset: { type: integer }
                ownerEpoch: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Event sequence evaluated successfully
        "400":
          description: Validation error

  /api/v1/events/held/drain:
    post:
      summary: Cascade Drain Held Sequence Events
      operationId: drainHeldEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - consumerGroup
                - handlerId
                - aggregateType
                - aggregateId
                - ownerEpoch
              properties:
                tenantId: { type: string }
                consumerGroup: { type: string }
                handlerId: { type: string }
                aggregateType: { type: string }
                aggregateId: { type: string }
                ownerEpoch: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Held events drained successfully
        "400":
          description: Invalid request or fenced epoch

  /api/v1/events/held:
    get:
      summary: List Parked Aggregate Trackers
      operationId: listHeldTrackers
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: consumer_group
          in: query
          required: false
          schema: { type: string }
        - name: handler_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of parked aggregate sequence trackers
        "500":
          description: Internal server error

  /api/v1/retries/evaluate:
    post:
      summary: Evaluate Retry Strategy and Backoff
      operationId: evaluateRetryStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - streamOrdering
                - classification
                - attemptNumber
                - maxAttempts
                - baseBackoffMs
                - maxBackoffMs
              properties:
                streamOrdering:
                  type: string
                  enum: [O_STRICT, O_STATE, O_NONE]
                classification:
                  type: string
                  enum: [ENVIRONMENTAL, CONTENTION, RATE_LIMITED, MESSAGE_TRANSIENT, AMBIGUOUS_EFFECT, CAUSAL_WAIT, PERMANENT_DATA, BUSINESS_REJECT, HANDLER_BUG, CRASH_POISON, REFERENCE_DATA_MISSING]
                attemptNumber:
                  type: integer
                  minimum: 1
                maxAttempts:
                  type: integer
                  minimum: 1
                baseBackoffMs:
                  type: integer
                  minimum: 1
                maxBackoffMs:
                  type: integer
                  minimum: 1
                circuitOpen:
                  type: boolean
                retryAfterMs:
                  type: integer
                validUntil:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Retry evaluation decision returned
        "400":
          description: Validation error

  /api/v1/retries/attempts:
    post:
      summary: Record Scheduled Retry Attempt in Ledger
      operationId: scheduleRetryAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - consumerGroup
                - handlerId
                - eventId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - attemptNumber
                - maxAttempts
                - backoffMs
                - dueAt
                - classification
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                consumerGroup: { type: string }
                handlerId: { type: string }
                eventId: { type: string }
                aggregateType: { type: string }
                aggregateId: { type: string }
                aggregateVersion: { type: integer, minimum: 1 }
                attemptNumber: { type: integer, minimum: 1 }
                maxAttempts: { type: integer, minimum: 1 }
                backoffMs: { type: integer, minimum: 0 }
                dueAt: { type: string, format: date-time }
                classification:
                  type: string
                  enum: [ENVIRONMENTAL, CONTENTION, RATE_LIMITED, MESSAGE_TRANSIENT, AMBIGUOUS_EFFECT, CAUSAL_WAIT, PERMANENT_DATA, BUSINESS_REJECT, HANDLER_BUG, CRASH_POISON, REFERENCE_DATA_MISSING]
                errorMessage: { type: string }
                errorCode: { type: string }
                validUntil: { type: string, format: date-time }
      responses:
        "201":
          description: Retry attempt recorded
        "400":
          description: Validation error

  /api/v1/retries/due:
    get:
      summary: Get Due Retry Attempts Ready for Execution
      operationId: getDueRetries
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: List of due retry attempts
        "500":
          description: Internal error

  /api/v1/consumer-groups/members:
    post:
      summary: Register Consumer Group Member
      operationId: registerConsumerGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - groupId
                - memberId
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                groupId: { type: string }
                memberId: { type: string }
                instanceId: { type: string }
                clientHost: { type: string }
                assignmentStrategy: { type: string }
      responses:
        "201":
          description: Member registered successfully
        "400":
          description: Validation failed or banned eager assignor

    get:
      summary: List Consumer Group Members
      operationId: listConsumerGroupMembers
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema: { type: string }
        - name: group_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of active members in consumer group
        "500":
          description: Internal error

  /api/v1/consumer-groups/heartbeat:
    post:
      summary: Pulse Consumer Member Heartbeat
      operationId: pulseConsumerHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - groupId
                - memberId
              properties:
                tenantId: { type: string }
                groupId: { type: string }
                memberId: { type: string }
                instanceId: { type: string }
                correlationId: { type: string }
      responses:
        "200":
          description: Heartbeat recorded and generation status returned
        "400":
          description: Validation error

  /api/v1/consumer-groups/rebalance:
    post:
      summary: Record Rebalance Partition Assignment Sync
      operationId: syncConsumerRebalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - groupId
                - memberId
                - generationId
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                groupId: { type: string }
                memberId: { type: string }
                generationId: { type: integer, minimum: 0 }
                rebalanceReason: { type: string }
                memberCount: { type: integer, minimum: 0 }
                revokedPartitions: { type: array, items: { type: object } }
                assignedPartitions: { type: array, items: { type: object } }
                durationMs: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Rebalance synced and partition assignment updated
        "400":
          description: Validation error

  /api/v1/offsets/commit:
    post:
      summary: Commit Topic Partition Offset
      operationId: commitOffset
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
        - name: x-correlation-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - groupId
                - topic
                - partition
                - offset
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                groupId: { type: string }
                topic: { type: string }
                partition: { type: integer, minimum: 0 }
                offset: { type: integer, minimum: 0 }
                logEndOffset: { type: integer, minimum: 0 }
                metadata: { type: string }
      responses:
        "200":
          description: Offset committed successfully
        "400":
          description: Validation error

  /api/v1/offsets/rewind:
    post:
      summary: Rewind Partition Offset for Recovery
      operationId: rewindOffset
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - groupId
                - topic
                - partition
                - targetOffset
                - reason
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                groupId: { type: string }
                topic: { type: string }
                partition: { type: integer, minimum: 0 }
                targetOffset: { type: integer, minimum: 0 }
                reason: { type: string }
                operatorId: { type: string }
      responses:
        "200":
          description: Offset rewound successfully
        "400":
          description: Validation error

  /api/v1/offsets/fast-forward:
    post:
      summary: Fast Forward Partition Offset Skipping Poison Messages
      operationId: fastForwardOffset
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - groupId
                - topic
                - partition
                - targetOffset
                - reason
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                groupId: { type: string }
                topic: { type: string }
                partition: { type: integer, minimum: 0 }
                targetOffset: { type: integer, minimum: 0 }
                reason: { type: string }
                operatorId: { type: string }
      responses:
        "200":
          description: Offset fast-forwarded successfully
        "400":
          description: Validation error

  /api/v1/backpressure/saturation:
    post:
      summary: Ingest Saturation Signal and Transition Backpressure State
      operationId: reportBackpressureSaturation
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - pauseReason
                - signal
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                pauseReason:
                  type: string
                  enum: [EXHAUSTED_CONCURRENCY, DOWNSTREAM_5XX, SLOW_DEPENDENCY, MEMORY_HIGH, OPERATOR_FORCE_PAUSE]
                observedLag: { type: integer, minimum: 0 }
                thresholdLag: { type: integer, minimum: 0 }
                signal:
                  type: object
                  additionalProperties: false
                  required:
                    - handlerId
                    - dependencyId
                  properties:
                    handlerId: { type: string }
                    dependencyId: { type: string }
                    currentConcurrency: { type: integer, minimum: 0 }
                    errorRatePercent: { type: number, minimum: 0, maximum: 100 }
                    latencyP99Ms: { type: integer, minimum: 0 }
                    observedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Saturation signal recorded and state transitioned
        "400":
          description: Validation error

  /api/v1/backpressure/recovery:
    post:
      summary: Report Dependency Recovery and Initiate Ramp-Up
      operationId: reportBackpressureRecovery
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - handlerId
                - dependencyId
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                handlerId: { type: string }
                dependencyId: { type: string }
                currentConcurrency: { type: integer, minimum: 0 }
                errorRatePercent: { type: number, minimum: 0, maximum: 100 }
                latencyP99Ms: { type: integer, minimum: 0 }
                observedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Recovery ramp initiated
        "400":
          description: Validation error

  /api/v1/backpressure/recovery/confirm:
    post:
      summary: Confirm Stable Health and Transition Backpressure to Normal
      operationId: confirmBackpressureRecovery
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - handlerId
                - dependencyId
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                handlerId: { type: string }
                dependencyId: { type: string }
                currentConcurrency: { type: integer, minimum: 0 }
                errorRatePercent: { type: number, minimum: 0, maximum: 100 }
                latencyP99Ms: { type: integer, minimum: 0 }
                observedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Normal state confirmed and concurrency limits restored
        "400":
          description: Validation error

  /api/v1/backpressure/state:
    get:
      summary: Query Current Backpressure State for Handler and Dependency
      operationId: getBackpressureState
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema: { type: string }
        - name: handler_id
          in: query
          required: true
          schema: { type: string }
        - name: dependency_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current backpressure tracking state
        "400":
          description: Validation error
        "404":
          description: State not found

  /api/v1/replay/runs:
    post:
      summary: Create New Replay Run with Side-Car Consumer Group
      operationId: createReplayRun
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - reason
                - targetProjection
                - targetTopic
                - startOffset
                - stopOffset
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                reason:
                  type: string
                  enum: [REBUILD, HYDRATE, FORENSIC, RECOVER, REPAIR]
                targetProjection: { type: string }
                targetTopic: { type: string }
                startOffset: { type: integer, minimum: 0 }
                stopOffset: { type: integer, minimum: -1 }
                createdBy: { type: string }
                initialLag: { type: integer, minimum: 0 }
                liveLagThreshold: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Replay run created in INITIALIZING state
        "400":
          description: Validation error
    get:
      summary: Fetch Replay Run Details
      operationId: getReplayRun
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema: { type: string }
        - name: run_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Replay run details
        "404":
          description: Replay run not found

  /api/v1/replay/runs/start:
    post:
      summary: Transition Replay Run from Initializing to Streaming
      operationId: startReplayStreaming
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runId
              properties:
                runId: { type: string }
      responses:
        "200":
          description: Streaming phase started
        "400":
          description: Validation error

  /api/v1/replay/runs/advance:
    post:
      summary: Advance Replay Offsets and Increment Progress
      operationId: advanceReplay
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runId
                - currentOffset
                - partition
              properties:
                tenantId: { type: string }
                runId: { type: string }
                currentOffset: { type: integer, minimum: 0 }
                partition: { type: integer, minimum: 0 }
                eventsReplayed: { type: integer, minimum: 0 }
                lag: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Replay run progress updated
        "400":
          description: Validation error

  /api/v1/replay/runs/promote:
    post:
      summary: Promote Replay Run to Caught Up when Lag Below Threshold
      operationId: promoteReplay
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runId
                - currentLag
              properties:
                tenantId: { type: string }
                runId: { type: string }
                currentLag: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Replay run promoted to CAUGHT_UP
        "400":
          description: Validation error

  /api/v1/replay/runs/cutover:
    post:
      summary: Complete Atomic Cutover of Shadow Projection
      operationId: completeReplayCutover
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - runId
                - cutoverConfirmed
              properties:
                tenantId: { type: string }
                runId: { type: string }
                cutoverConfirmed: { type: boolean }
      responses:

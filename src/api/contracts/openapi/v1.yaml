# OpenAPI 3.1 REST Specification
openapi: 3.1.0
info:
  title: event-driven-platform API
  version: 1.0.0
paths:
  /api/v1/schemas:
    post:
      summary: Register Event Schema
      operationId: registerSchema
      responses:
        "201":
          description: Schema successfully registered
        "400":
          description: Validation failed
  /api/v1/outbox:
    post:
      summary: Stage Transactional Outbox Record
      operationId: createOutboxRecord
      parameters:
        - name: x-idempotency-key
          in: header
          required: false
          schema:
            type: string
            description: Unique business command idempotency key preventing duplicate aggregates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - aggregateType
                - aggregateId
                - aggregateVersion
                - eventType
                - schemaVersion
                - payload
              properties:
                tenantId:
                  type: string
                sourceService:
                  type: string
                externalId:
                  type: string
                aggregateType:
                  type: string
                aggregateId:
                  type: string
                aggregateVersion:
                  type: integer
                  minimum: 1
                eventType:
                  type: string
                schemaVersion:
                  type: string
                payload:
                  type: object
                  description: Event body strictly without floating-point numbers
                headers:
                  type: object
                  additionalProperties:
                    type: string
                cdcMode:
                  type: boolean
                  description: When true executes write path step 5 (insert and immediate delete in same tx for WAL CDC)
      responses:
        "201":
          description: Outbox record successfully staged
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, data, meta]
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          description: Validation failed
        "500":
          description: Internal server error
  /api/v1/outbox/relay:
    post:
      summary: Trigger Outbox Relay Batch
      operationId: relayOutboxBatch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchSize:
                  type: integer
                  minimum: 1
                  default: 50
      responses:
        "200":
          description: Batch successfully relayed
          content:
            application/json:
              schema:
                type: object
                required: [success, statusCode, data, meta]
                properties:
                  success: { type: boolean }
                  statusCode: { type: integer }
                  data:
                    type: object
                    required: [publishedCount]
                    properties:
                      publishedCount: { type: integer }
                  meta:
                    type: object
                    required: [requestId, correlationId, timestamp, executionTimeMs, apiVersion]
                    properties:
                      requestId: { type: string }
                      correlationId: { type: string }
                      timestamp: { type: string }
                      executionTimeMs: { type: integer }
                      apiVersion: { type: string }
        "400":
          description: Validation failed
        "500":
          description: Internal server error

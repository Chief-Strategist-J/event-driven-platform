          description: Cutover completed and run transitioned to COMPLETED
        "400":
          description: Validation error

  /api/v1/replay/effects/evaluate:
    post:
      summary: Evaluate Side-Effect Routing Gateway for Replay Run
      operationId: evaluateReplayEffect
      parameters:
        - name: x-tenant-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sourceService
                - externalId
                - runId
                - effectType
                - destination
                - payload
              properties:
                tenantId: { type: string }
                sourceService: { type: string }
                externalId: { type: string }
                correlationId: { type: string }
                runId: { type: string }
                effectType: { type: string }
                destination: { type: string }
                payload: { type: string }
      responses:
        "200":
          description: Effect evaluation result returned (DISPATCH, MOCK, SUPPRESS, RECORD_SHADOW)

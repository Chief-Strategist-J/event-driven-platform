feature: micro-batched-cqrs-upserts
owner: platform-performance-team
description: >
  Batched 500-row multi-statement projection upserts to eliminate DB roundtrip latency.

boundaries:
  - Scoped to performance-scaling and high-throughput execution.
  - Zero inline SQL; zero comments in source files.
  - Conforms to hexagonal architecture and 1-feature-folder-writing-rule.

ports:
  driven:
    - MicroBatchedCqrsUpsertsRepositoryPort (infrastructure/ports/micro-batched-cqrs-upserts.repository.port.go)
  driving:
    - MicroBatchedCqrsUpsertsService methods exposed through feature facade (index.go)

invariants:
  - PERF-01: Zero allocation on hot execution path.
  - PERF-02: Bounded latency under p99 SLA limits.
  - PERF-03: Thread-safe non-blocking concurrent access.

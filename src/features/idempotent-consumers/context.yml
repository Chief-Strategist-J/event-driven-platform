feature: idempotent-consumers
mode: stateless_hexagonal

entities:
  - entity: consumer_inbox
    owner: event-driven-platform
    description: Operational deduplication ledger recording processed event IDs per tenant and handler
    fields:
      - name: id
        type: uuid
        null: no
        default: uuidv7()
        constraint: PK(tenant_id, id), immutable
      - name: tenant_id
        type: varchar(64)
        null: no
        normalize: trim
        constraint: CHECK (tenant_id = btrim(tenant_id) AND tenant_id <> ''), immutable
      - name: handler_id
        type: varchar(64)
        null: no
        normalize: trim
        constraint: CHECK (handler_id = btrim(handler_id) AND handler_id <> ''), immutable
      - name: event_id
        type: uuid
        null: no
        constraint: immutable
      - name: aggregate_type
        type: varchar(64)
        null: no
        normalize: trim
        constraint: CHECK (aggregate_type = btrim(aggregate_type) AND aggregate_type <> '')
      - name: aggregate_id
        type: varchar(128)
        null: no
        normalize: trim
        constraint: CHECK (aggregate_id = btrim(aggregate_id) AND aggregate_id <> '')
      - name: aggregate_version
        type: bigint
        null: no
        constraint: CHECK (aggregate_version >= 1)
      - name: event_type
        type: varchar(128)
        null: no
        normalize: trim
        constraint: CHECK (event_type = btrim(event_type) AND event_type <> '')
      - name: payload_hash
        type: varchar(64)
        null: no
        normalize: trim
        constraint: CHECK (payload_hash ~ '^[0-9a-f]{64}$')
      - name: processed_at
        type: timestamptz
        null: no
        default: now()
        constraint: immutable
    constraints:
      - consumer_inbox_dedupe_uk: UNIQUE (tenant_id, handler_id, event_id)
    invariants:
      - inbox records are append-only and strictly immutable
      - deduplication scope is strictly (tenant_id, handler_id, event_id)
    pii: []
    source_of_truth: db

  - entity: consumer_projections
    owner: event-driven-platform
    description: Monotonic aggregate version progression and split-brain poison pill guard scoped per handler
    fields:
      - name: tenant_id
        type: varchar(64)
        null: no
        normalize: trim
        constraint: PK, CHECK (tenant_id = btrim(tenant_id) AND tenant_id <> '')
      - name: handler_id
        type: varchar(64)
        null: no
        normalize: trim
        constraint: PK, CHECK (handler_id = btrim(handler_id) AND handler_id <> '')
      - name: aggregate_type
        type: varchar(64)
        null: no
        normalize: trim
        constraint: PK, CHECK (aggregate_type = btrim(aggregate_type) AND aggregate_type <> '')
      - name: aggregate_id
        type: varchar(128)
        null: no
        normalize: trim
        constraint: PK, CHECK (aggregate_id = btrim(aggregate_id) AND aggregate_id <> '')
      - name: last_version
        type: bigint
        null: no
        default: 0
        constraint: CHECK (last_version >= 0)
      - name: last_event_id
        type: uuid
        null: no
      - name: last_payload_hash
        type: varchar(64)
        null: no
        normalize: trim
        constraint: CHECK (last_payload_hash ~ '^[0-9a-f]{64}$' OR last_payload_hash = '')
      - name: is_parked
        type: boolean
        null: no
        default: false
      - name: updated_at
        type: timestamptz
        null: no
        default: now()
    constraints:
      - pk_consumer_projections: PRIMARY KEY (tenant_id, handler_id, aggregate_type, aggregate_id)
    invariants:
      - last_version monotonically advances per handler
      - divergent payload hash on same version forces is_parked = true
    pii: []
    source_of_truth: db

  - entity: consumer_partition_offsets
    owner: event-driven-platform
    description: Partition-level offset tracking for transactional consumer checkpointing
    fields:
      - name: topic
        type: varchar(128)
        null: no
        normalize: trim
        constraint: PK, CHECK (topic = btrim(topic) AND topic <> '')
      - name: partition
        type: int
        null: no
        constraint: PK, CHECK (partition >= 0)
      - name: offset_val
        type: bigint
        null: no
        constraint: CHECK (offset_val >= 0)
      - name: updated_at
        type: timestamptz
        null: no
        default: now()
    constraints:
      - pk_consumer_partition_offsets: PRIMARY KEY (topic, partition)
    invariants:
      - offset values can only increase monotonically per topic and partition
    pii: []
    source_of_truth: db

invariants:
  - IC-01: Atomic effect (inbox record + business projection + offset in ONE transaction)
  - IC-02: Effect-once semantics (transport is at-least-once forever)
  - IC-03: Dedupe identity based on producer-assigned event_id
  - IC-04: Two-layer defense (Layer 1: event_id dedupe; Layer 2: aggregate_version monotonic guard)
  - IC-05: Version rule: v <= last (skip); v == last + 1 (apply); v > last + 1 (hold gap)
  - IC-06: State vs Delta semantics (State allows strictly newer; Delta requires exactly next version)
  - IC-08: Dedupe scope is scoped to (handler_id, event_id), never event_id alone
  - IC-10: No ordering bypass (DLQ re-drive cannot apply stale versions over newer versions)

failure_cases:
  F3.1.1:
    scenario: Unique violation on consumer inbox handled as exception aborts transaction
    mitigation: FlowInsertConsumerInboxRecord uses ON CONFLICT DO NOTHING, returning rows_affected == 0 to skip duplicate cleanly.
  F3.1.5:
    scenario: Zombie consumer processes stale event concurrently with new partition owner
    mitigation: Layer 2 Version Guard checks incoming version against last_version; stale zombie writes are rejected.
  F3.2.2:
    scenario: Strictly newer rule mistakenly used for DELTA events
    mitigation: rules.EvaluateVersionRule mandates v == last + 1 for DELTA; gaps trigger ActionHoldGap.
  F3.2.4:
    scenario: Same version received with divergent content (upstream restore / split brain)
    mitigation: Payload SHA-256 hash comparison against last_payload_hash; mismatch triggers ActionParkPoison.

ports:
  driving:
    - IdempotentConsumerRouter: POST /api/v1/consumers/inbox
  driven:
    - ConsumerRepositoryPort: Inbox storage, version projection guard, and partition offset persistence

adapters:
  outbound:
    - MemoryConsumerRepositoryAdapter: In-memory repository adapter for testing
    - PostgresConsumerRepositoryAdapter: Live PostgreSQL adapter using consumer_inbox and consumer_projections


definition:
  what: An idempotent consumer processes duplicate event deliveries safely by executing state mutations exactly once and dropping redundant deliveries without corrupting system state.
  scope: Transport inbox deduplication (handler_id + event_id) and aggregate version projection monotonic progression.

real_life_use:
  - Payment processing deduplication preventing duplicate card charges on network retry
  - Order fulfillment avoiding duplicate warehouse dispatch during consumer group rebalance
  - CQRS read model updates ensuring out-of-order event replays do not overwrite newer state

design_principles:
  - At-Least-Once Broker Compensation
  - Atomic Inbox Recording
  - Deterministic State Transitions
  - Semantic Delta vs State Separation
  - Split-Brain Content Collision Quarantine

function_structure: |
  Legend
    name(inputs) → output
    ⚠  can fail      ↺  registers cleanup      ▶  service-owned code
    ✚  required at 100+ services, missing from the single-service tree

  Tree 1: main wiring (chassis serviceSpec)

  main(args, env)
  └── exit( chassis.Run(describeService(), args, env) )

  describeService() → serviceSpec
  ├── buildServices(deps) → services                                        ▶
  │   ├── config.LoadConfig("") → cfg                                   ⚠
  │   ├── sql.Open("postgres", cfg.Database.URL) → db                  ↺ ⚠
  │   ├── consumerAdapters.NewPostgresConsumerRepositoryAdapter(db) → consumerRepo
  │   ├── consumerService.NewConsumerService(consumerRepo) → consumerSvc
  │   └── chassis.Services{ Registry: {"consumerService": consumerSvc} }
  │
  └── registerApiRoutes(router, services)                                   ▶
      ├── services.Registry["consumerService"] → consumerSvc
      ├── handlers.NewConsumerHandler(consumerSvc) → consumerHandler
      └── router.HandleFunc("POST /v1/events/consume", consumerHandler.HandleConsume)

  Tree 2: end-to-end runtime execution function stack

  handleConsume(w, r) → httpResponse                                    ▶ ⚠
  ├── json.NewDecoder(r.Body).Decode(&event) → inboundEvent             ⚠ EXIT_BAD_REQUEST
  ├── validateInboundConsumerEvent(event) → error                       ⚠ EXIT_VALIDATION
  └── consumerSvc.ConsumeEvent(ctx, event) → consumeResult              ▶ ⚠
      ├── computePayloadHash(event.Payload) → payloadHash
      ├── utils.GenerateUUIDv7() → inboxID                              ⚠
      ├── repo.RecordInbox(ctx, inboxRecord) → inserted                 ↺ ⚠
      │   └── inserted == false → return {ActionSkip, "transport duplicate"}
      ├── repo.GetProjection(ctx, tenant, handler, type, id) → proj    ↺ ⚠
      ├── proj.IsParked == true → return {ActionParkPoison}
      ├── isContentHashConsistent(proj.LastPayloadHash, payloadHash)    ▶
      │   └── inconsistent → repo.ParkAggregate(...) + return {ActionParkPoison}
      ├── evaluateVersionRule(currentVersion, incomingVersion, class)   ▶
      │   ├── incoming <= current → return {ActionSkip, "stale version"}
      │   ├── delta & incoming > current + 1 → return {ActionHoldGap}
      │   └── incoming == current + 1 (or state > current) → ActionApply
      └── repo.UpsertProjection(ctx, updatedProjection)                 ↺ ⚠
          └── return {ActionApply, appliedVersion}

  Tree 3: chassis consumer worker & background pipeline

  wireWorker(app, lifecycle) → LONG_RUNNING
  ├── wireAdmin(app, lifecycle)
  ├── buildConsumerGroup(app, schemaRegistry) → group
  │   ├── standardConsumerWrapping()
  │   │   ├── withTracing(tracer)                                       ↺
  │   │   ├── withIdempotencyStore(app.infra.db)
  │   │   ├── withRetryPolicy(spec.retryPolicy)                         ⚠
  │   │   └── withDeadLetterSink(spec.dlqSink)                          ⚠
  │   ├── exportLagMetric() → autoscalerSignal                          ✚
  │   └── spec.registerConsumers(group, app.services)                  ▶
  │       └── group.RegisterHandler("platform.events.ingest", consumerSvc.ConsumeEvent)
  ├── lifecycle.addComponent("consumers", group.start, group.drainAndCommit)
  └── wireJobs(app, lifecycle)
      └── addComponent("inbox-compaction-job", withLeaderElection(job), job.stop)
          └── repo.PurgeExpiredInbox(ctx, retentionWindow)              ↺ ⚠

  Tree 4: storage & transactional persistence mechanics

  repo.RecordInbox(ctx, record) → inserted                              ↺ ⚠
  ├── db.BeginTx(ctx, &sql.TxOptions{Isolation: sql.LevelReadCommitted}) → tx ↺ ⚠
  ├── tx.ExecContext(ctx, queryInsertInbox, params...) → result         ⚠
  │   └── ON CONFLICT (tenant_id, handler_id, event_id) DO NOTHING
  ├── result.RowsAffected() → rows
  │   ├── rows == 0 → tx.Rollback() + return false                      ↺
  │   └── rows == 1 → tx.Commit() + return true                         ↺
  └── release connection to pool                                        ↺

  repo.UpsertProjection(ctx, proj) → error                              ↺ ⚠
  ├── db.BeginTx(ctx, &sql.TxOptions{Isolation: sql.LevelReadCommitted}) → tx ↺ ⚠
  ├── tx.ExecContext(ctx, queryUpsertProjection, params...) → result    ⚠
  │   └── ON CONFLICT (tenant_id, handler_id, aggregate_type, aggregate_id)
  │       DO UPDATE SET last_version = excluded.last_version,
  │                     last_event_id = excluded.last_event_id,
  │                     last_payload_hash = excluded.last_payload_hash,
  │                     updated_at = now()
  │       WHERE consumer_projections.last_version < excluded.last_version
  ├── result.RowsAffected() → rows
  │   ├── rows == 0 → tx.Rollback() + return ErrStaleVersion            ↺ ⚠
  │   └── rows == 1 → tx.Commit() + return nil                          ↺
  └── release connection to pool                                        ↺

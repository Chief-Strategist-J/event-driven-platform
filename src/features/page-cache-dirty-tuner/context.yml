feature: page-cache-dirty-tuner
owner: platform-performance-team
description: >
  Kernel vm.dirty_ratio and vm.dirty_background_ratio memory tuning for asynchronous NVMe flushing.

boundaries:
  - Scoped to performance-scaling and high-throughput execution.
  - Zero inline SQL; zero comments in source files.
  - Conforms to hexagonal architecture and 1-feature-folder-writing-rule.

ports:
  driven:
    - PageCacheDirtyTunerRepositoryPort (infrastructure/ports/page-cache-dirty-tuner.repository.port.go)
  driving:
    - PageCacheDirtyTunerService methods exposed through feature facade (index.go)

invariants:
  - PERF-01: Zero allocation on hot execution path.
  - PERF-02: Bounded latency under p99 SLA limits.
  - PERF-03: Thread-safe non-blocking concurrent access.

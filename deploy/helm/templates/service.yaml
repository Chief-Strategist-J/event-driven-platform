apiVersion: v1
kind: Service
metadata:
  name: {{ include "event-driven-platform.fullname" . }}
  labels:
    {{- include "event-driven-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.connectRpcPort }}
      targetPort: connect-rpc
      protocol: TCP
      name: connect-rpc
    - port: {{ .Values.service.adminPort }}
      targetPort: http-admin
      protocol: TCP
      name: http-admin
  selector:
    {{- include "event-driven-platform.selectorLabels" . | nindent 4 }}

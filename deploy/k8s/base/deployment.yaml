apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-driven-platform
  labels:
    app.kubernetes.io/name: event-driven-platform
    app.kubernetes.io/part-of: event-driven-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: event-driven-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-driven-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-service
          image: ghcr.io/scaibu/event-driven-platform:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: connect-rpc
              containerPort: 50051
              protocol: TCP
            - name: http-admin
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-admin
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: event-platform-config

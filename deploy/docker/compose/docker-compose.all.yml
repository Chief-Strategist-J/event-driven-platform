# Self-contained, one-command stack: Postgres + Kafka + Apicurio + Debezium + migrate + app.
#   docker compose -f deploy/docker/compose/docker-compose.all.yml up -d --wait
# Every host port, password, image and name is overridable via env (see .env.example).
name: ${COMPOSE_PROJECT_NAME:-event-driven-platform}

x-logging: &logging
  driver: local
  options: { max-size: "10m", max-file: "5" }

x-app-image: &app-image ${EDP_IMAGE:-chiefj/event-driven-platform}:${EDP_TAG:-latest}

x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  # Set NO_NEW_PRIVILEGES=false on hosts whose AppArmor profile blocks exec under
  # no-new-privileges ("exec /usr/bin/tini: operation not permitted"). See docs/adr/ADR-0003.
  security_opt: ["no-new-privileges:${NO_NEW_PRIVILEGES:-true}"]
  # The image already runs tini as PID 1; do not double-wrap.
  init: false
  tmpfs: [/tmp]
  logging: *logging

x-db-env: &db-env
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-event_store}?sslmode=disable

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${EDP_BIND_ADDR:-127.0.0.1}:${EDP_POSTGRES_PORT:-15432}:5432"
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Outbox topics are named after aggregateType; auto-create makes the quickstart work.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "5L622nShTUiT8NYvQvGh3x"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }
    logging: *logging

  apicurio:
    image: ${APICURIO_IMAGE:-apicurio/apicurio-registry-mem:2.6.5.Final}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M }
    logging: *logging

  debezium:
    image: ${DEBEZIUM_IMAGE:-debezium/connect:2.7.3.Final}
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: "my_connect_configs"
      OFFSET_STORAGE_TOPIC: "my_connect_offsets"
      STATUS_STORAGE_TOPIC: "my_connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    depends_on:
      kafka: { condition: service_healthy }
      db:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 768M }
    logging: *logging

  migrate:
    <<: *app-hardening
    image: *app-image
    command: ["migrate"]
    restart: "no"
    environment:
      <<: *db-env
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }

  app:
    <<: *app-hardening
    image: *app-image
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      migrate:  { condition: service_completed_successfully }
      db:       { condition: service_healthy }
      kafka:    { condition: service_healthy }
      apicurio: { condition: service_healthy }
      debezium: { condition: service_healthy }
    ports:
      - "${EDP_BIND_ADDR:-127.0.0.1}:${EDP_API_PORT:-8080}:8080"
      - "${EDP_BIND_ADDR:-127.0.0.1}:${EDP_ADMIN_PORT:-8081}:8081"
    environment:
      <<: *db-env
      PORT: "8080"
      ADMIN_PORT: "8081"
      ADMIN_HOST: "0.0.0.0"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      KAFKA_CONNECT_URL: http://debezium:8083
      CDC_DB_HOST: db
      CDC_DB_PORT: "5432"
      CDC_DB_USER: ${POSTGRES_USER:-postgres}
      CDC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CDC_DB_NAME: ${POSTGRES_DB:-event_store}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      OTEL_SERVICE_NAME: event-driven-platform
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:       { cpus: "1.5", memory: 512M }
        reservations: { memory: 128M }
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    restart: unless-stopped
    ports:
      - "${EDP_BIND_ADDR:-127.0.0.1}:${EDP_PROMETHEUS_PORT:-9090}:9090"
    configs:
      - source: prometheus_cfg
        target: /etc/prometheus/prometheus.yml
    depends_on:
      app: { condition: service_healthy }
    logging: *logging

configs:
  prometheus_cfg:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: event-driven-platform
          metrics_path: /metrics
          static_configs:
            - targets: ["app:8081"]

volumes:
  pgdata:
  kafkadata:

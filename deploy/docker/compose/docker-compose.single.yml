include:
  - path: docker-compose.infra.yml

x-hardening-app: &hardening-app
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  logging: { driver: local, options: { max-size: "10m", max-file: "5" } }

services:
  app:
    <<: *hardening-app
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile
      args:
        SERVICE_PATH: .
    image: ${REGISTRY:-ghcr.io/scaibu}/event-driven-platform:latest
    depends_on:
      db:       { condition: service_healthy, restart: true }
      cache:    { condition: service_healthy, restart: true }
      kafka:    { condition: service_healthy, restart: true }
      apicurio: { condition: service_healthy, restart: true }
      otel-collector: { condition: service_started }
    networks: [frontend, backend]
    expose: ["8080", "8081"]
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      ADMIN_HOST: "0.0.0.0"
      ENVIRONMENT: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: event_store
      DB_SSLMODE: disable
      DATABASE_URL: postgres://postgres:postgres@db:5432/event_store?sslmode=disable
      CACHE_HOST: cache
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: event-driven-platform
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    tmpfs: [/tmp]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/live || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:       { cpus: "1.5", memory: 512M }
        reservations: { memory: 128M }
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  app-dev:
    profiles: [dev]
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile.dev
      args:
        SERVICE_PATH: .
    depends_on:
      db:       { condition: service_healthy }
      cache:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
      apicurio: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [frontend, backend]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      ADMIN_HOST: "0.0.0.0"
      ENVIRONMENT: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: event_store
      DB_SSLMODE: disable
      DATABASE_URL: postgres://postgres:postgres@db:5432/event_store?sslmode=disable
      CACHE_HOST: cache
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: event-driven-platform
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    develop:
      watch:
        - { action: sync,         path: ../../../src,    target: /app/src }
        - { action: sync+restart, path: ../../../config, target: /app/config }
        - { action: rebuild,      path: ../../../go.mod }

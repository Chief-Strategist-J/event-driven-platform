include:
  - path: docker-compose.infra.yml

x-hardening-app: &hardening-app
  read_only: true
  cap_drop: [ALL]
  # Hardening default is on. Hosts whose Docker AppArmor profile blocks exec under
  # no-new-privileges (symptom: "exec /usr/bin/tini: operation not permitted") can set
  # NO_NEW_PRIVILEGES=false in the environment. See docs/adr/ADR-0003.
  security_opt: ["no-new-privileges:${NO_NEW_PRIVILEGES:-true}"]
  # The image already runs tini as PID 1 (see service/Dockerfile ENTRYPOINT); a second
  # docker-init would double-wrap it.
  init: false
  restart: unless-stopped
  logging: { driver: local, options: { max-size: "10m", max-file: "5" } }

services:
  app:
    <<: *hardening-app
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile
      args:
        SERVICE_PATH: .
    image: ${REGISTRY:-ghcr.io/scaibu}/event-driven-platform:latest
    depends_on:
      db:       { condition: service_healthy, restart: true }
      cache:    { condition: service_healthy, restart: true }
      kafka:    { condition: service_healthy, restart: true }
      apicurio: { condition: service_healthy, restart: true }
      otel-collector: { condition: service_started }
    networks: [frontend, backend]
    expose: ["8080", "8081"]
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      ADMIN_HOST: "0.0.0.0"
      ENVIRONMENT: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: event_store
      DB_SSLMODE: disable
      DATABASE_URL: postgres://postgres:postgres@db:5432/event_store?sslmode=disable
      CACHE_HOST: cache
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: event-driven-platform
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    tmpfs: [/tmp]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:       { cpus: "1.5", memory: 512M }
        reservations: { memory: 128M }
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  app-dev:
    profiles: [dev]
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile.dev
      args:
        SERVICE_PATH: .
    depends_on:
      db:       { condition: service_healthy }
      cache:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
      apicurio: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [frontend, backend]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      ADMIN_HOST: "0.0.0.0"
      ENVIRONMENT: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_NAME: event_store
      DB_SSLMODE: disable
      DATABASE_URL: postgres://postgres:postgres@db:5432/event_store?sslmode=disable
      CACHE_HOST: cache
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: event-driven-platform
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    develop:
      watch:
        - { action: sync,         path: ../../../src,    target: /app/src }
        - { action: sync+restart, path: ../../../config, target: /app/config }
        - { action: rebuild,      path: ../../../go.mod }

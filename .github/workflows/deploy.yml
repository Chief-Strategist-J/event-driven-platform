name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: event-driven-platform/deploy/docker/service/Dockerfile

      - name: Validate Docker Compose
        run: |
          docker compose -f event-driven-platform/deploy/docker/compose/docker-compose.infra.yml config --quiet
          APP_DIGEST=sha256:d824d528994a5c92c813be5bfb3a58eeb06f190a07e868a83ee07ff5b3f11467 \
            docker compose -f event-driven-platform/deploy/docker/compose/docker-compose.single.yml config --quiet

      - name: Run Integration Tests with Testcontainers
        run: |
          cd event-driven-platform
          go test -v ./deploy/tests/integration/... -timeout 5m

  build-and-sign:
    needs: validate-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: event-driven-platform
          file: event-driven-platform/deploy/docker/service/Dockerfile
          push: false
          tags: ghcr.io/scaibu/event-driven-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
